<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LAST CALL — Messenger</title><meta name="description" content="LAST CALL Messenger — private conversations between members."><style>:root{--black:#070706;--panel:#0d0d0b;--cream:#f4eddf;--gold:#d7b65d;--green:#205b37;--muted:#aaa193;--line:rgba(215,182,93,.24)}*{box-sizing:border-box}body{margin:0;background:var(--black);color:var(--cream);font-family:Georgia,'Times New Roman',serif}.wrap{width:min(1100px,100%);margin:auto;padding:0 18px}a{color:inherit;text-decoration:none}.nav{height:62px;border-bottom:1px solid var(--line);display:flex;align-items:center}.navin{display:flex;align-items:center;gap:22px}.brand{font-size:18px;font-weight:bold;letter-spacing:3px}.links{margin-left:auto;display:flex;gap:17px;font:8px Arial,sans-serif;text-transform:uppercase;letter-spacing:1px}.layout{height:calc(100vh - 62px);display:grid;grid-template-columns:290px 1fr;max-width:1100px;margin:auto}.people{border-right:1px solid var(--line);background:var(--panel);overflow:auto}.people-head{padding:20px 16px;border-bottom:1px solid var(--line)}.eyebrow{font:7px Arial,sans-serif;color:#ecd27f;letter-spacing:3px;text-transform:uppercase}.people-head h1{font-size:24px;margin:8px 0}.search{width:100%;background:#11110f;border:1px solid rgba(215,182,93,.25);color:var(--cream);padding:9px;font:9px Arial,sans-serif}.person{padding:12px 14px;border-bottom:1px solid rgba(215,182,93,.11);display:grid;grid-template-columns:38px 1fr;gap:9px;cursor:pointer}.person.active{background:#161612}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#2b2a23;border:1px solid var(--gold);font-size:15px}.pname{font-size:12px}.preview{font:7px Arial,sans-serif;color:#8f8779;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat{display:flex;flex-direction:column;min-width:0}.chathead{height:68px;border-bottom:1px solid var(--line);padding:13px 18px;display:flex;align-items:center;gap:10px}.chathead strong{font-size:15px}.chathead span{display:block;font:7px Arial,sans-serif;color:#8f8779;margin-top:3px}.messages{flex:1;padding:22px 20px;overflow:auto;background:#080807}.bubble{max-width:65%;padding:10px 12px;margin:7px 0;border:1px solid var(--line);font:10px Arial,sans-serif;line-height:1.45}.bubble.them{background:var(--panel);border-radius:2px 10px 10px 10px}.bubble.me{background:var(--green);margin-left:auto;border-radius:10px 2px 10px 10px}.time{display:block;font-size:6px;color:#a79f90;margin-top:5px}.composer{border-top:1px solid var(--line);padding:10px;display:flex;gap:7px;background:var(--panel)}.composer input{flex:1;background:#11110f;border:1px solid rgba(215,182,93,.3);color:var(--cream);padding:10px;font:10px Arial,sans-serif}.send,.request{border:1px solid var(--gold);background:var(--green);color:var(--cream);padding:8px 14px;font:7px Arial,sans-serif;text-transform:uppercase;letter-spacing:1px;cursor:pointer}.notice{font:8px Arial,sans-serif;color:#81796d;text-align:center;padding:10px}.mobileback{display:none}.empty{padding:30px 18px;color:var(--muted);font:10px Arial,sans-serif;line-height:1.6}@media(max-width:700px){.wrap{padding:0 10px}.nav{height:50px}.navin{gap:10px}.brand{font-size:12px}.links{gap:8px;font-size:5px}.layout{height:calc(100vh - 50px);grid-template-columns:1fr}.people{border-right:0}.chat{display:none}.layout.chat-open .people{display:none}.layout.chat-open .chat{display:flex}.mobileback{display:block;border:0;background:transparent;color:#ecd27f;font:12px Arial,sans-serif;cursor:pointer}.people-head{padding:15px 10px}.people-head h1{font-size:20px}.person{padding:11px 10px}}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><nav class="nav"><div class="navin wrap"><a class="brand" href="index.html">LAST CALL</a><div class="links"><a href="community.html">Community</a><a href="index.html#stories">Stories</a><a href="index.html#categories">Categories</a></div></div></nav><main class="layout" id="layout"><aside class="people"><div class="people-head"><div class="eyebrow">LAST CALL · Messenger</div><h1>Messages</h1><input id="search" class="search" placeholder="Search conversations…" oninput="filterPeople(this.value)"></div><div id="people"><div class="empty">Loading your conversations…</div></div></aside><section class="chat"><header class="chathead"><button class="mobileback" onclick="closeChat()">‹</button><div class="avatar">🍺</div><div><strong id="chatname">Messages</strong><span id="status">Private conversations</span></div></header><div class="messages" id="messages"><div class="notice">Private messages are only available between members who choose to connect.</div></div><form class="composer" onsubmit="sendMessage(event)"><input id="message" placeholder="Write a message…" autocomplete="off"><button class="send">Send</button></form></section></main><script>const URL='https://ccqyreaanjhfhglmmgkn.supabase.co',KEY='sb_publishable_LHWzWXPoDCD0VBl1i6QeBg_uFXrS_yL',db=supabase.createClient(URL,KEY);let me=null,convos=[],active=null;const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');async function init(){me=(await db.auth.getSession()).data.session?.user;if(!me){people.innerHTML='<div class="empty">Sign in to use Messenger.<br><br><a href="index.html#signin">Sign in →</a></div>';return}await loadConversations();const cid=new URLSearchParams(location.search).get('conversation');if(cid&&convos.some(x=>x.id===cid))await openChat(cid)}async function loadConversations(){const {data:m}=await db.from('conversation_members').select('conversation_id,status').eq('user_id',me.id);const ids=(m||[]).map(x=>x.conversation_id);if(!ids.length){people.innerHTML='<div class="empty">No conversations yet.<br><br>Visit Community to discover members and start a conversation.</div>';return}const {data:all}=await db.from('conversation_members').select('conversation_id,user_id,status').in('conversation_id',ids);const others=(all||[]).filter(x=>x.user_id!==me.id);const otherIds=[...new Set(others.map(x=>x.user_id))];const {data:profiles}=otherIds.length?await db.from('profiles').select('id,display_name,username,is_anonymous').in('id',otherIds):{data:[]};const pm=new Map((profiles||[]).map(x=>[x.id,x]));convos=ids.map(cid=>{const o=others.find(x=>x.conversation_id===cid);const p=o&&pm.get(o.user_id);return {id:cid,userId:o?.user_id,name:p?(p.is_anonymous?'Anonymous':(p.display_name||'Anonymous')):'Member',status:o?.status||'accepted'};});renderPeople(convos)}function renderPeople(list){people.innerHTML=list.map(p=>`<div class="person ${active===p.id?'active':''}" onclick="openChat('${p.id}')"><div class="avatar">🍺</div><div><div class="pname">${esc(p.name)}</div><div class="preview">${p.status==='pending'?'Message request':'Private conversation'}</div></div></div>`).join('')||'<div class="empty">No conversations yet.</div>'}function filterPeople(q){q=q.toLowerCase();renderPeople(convos.filter(x=>x.name.toLowerCase().includes(q)))}async function openChat(cid){active=cid;const c=convos.find(x=>x.id===cid);if(!c)return;chatname.textContent=c.name;status.textContent=c.status==='pending'?'Message request · choose what happens next':'Private conversation';layout.classList.add('chat-open');renderPeople(convos);await loadMessages(cid);if(c.status==='pending')messages.insertAdjacentHTML('afterbegin',`<div class="notice"><button class="request" onclick="acceptRequest('${cid}')">Accept request</button> <button class="request" onclick="blockRequest('${cid}')">Block</button></div>`)}async function loadMessages(cid){const {data}=await db.from('messages').select('id,sender_id,body,created_at').eq('conversation_id',cid).order('created_at',{ascending:true});messages.innerHTML='<div class="notice">Private messages are for members who choose to connect.</div>'+(data||[]).map(m=>`<div class="bubble ${m.sender_id===me.id?'me':'them'}">${esc(m.body)}<span class="time">${new Date(m.created_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</span></div>`).join('');messages.scrollTop=messages.scrollHeight}async function sendMessage(e){e.preventDefault();const text=message.value.trim();if(!text||!active)return;const c=convos.find(x=>x.id===active);if(c?.status!=='accepted')return;const {error}=await db.from('messages').insert({conversation_id:active,sender_id:me.id,body:text});if(error)return;message.value='';await loadMessages(active)}async function acceptRequest(cid){const {error}=await db.rpc('respond_to_message_request',{cid,decision:'accepted'});if(!error){const c=convos.find(x=>x.id===cid);if(c)c.status='accepted';await openChat(cid)}}async function blockRequest(cid){const {error}=await db.rpc('respond_to_message_request',{cid,decision:'blocked'});if(!error){convos=convos.filter(x=>x.id!==cid);active=null;closeChat();renderPeople(convos)}}function closeChat(){layout.classList.remove('chat-open');history.replaceState({},'',location.pathname)}init();</script></body></html>
