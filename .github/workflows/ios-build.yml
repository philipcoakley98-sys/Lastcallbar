name: iOS build check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select modern Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version

      - name: Generate LAST CALL iOS app icons
        run: bash scripts/generate-ios-icons.sh

      - name: Commit generated app icon sizes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios/LastCall/Assets.xcassets/AppIcon.appiconset/*.png
          if git diff --cached --quiet; then
            echo "No generated icon changes to commit."
          else
            git commit -m "Generate LAST CALL app icon sizes"
            git push
          fi

      - name: Build LAST CALL Debug for iPhone Simulator
        run: xcodebuild -project ios/LastCall.xcodeproj -scheme LastCall -sdk iphonesimulator -configuration Debug -derivedDataPath build/DebugDerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Build LAST CALL Release for iPhone Simulator
        run: xcodebuild -project ios/LastCall.xcodeproj -scheme LastCall -sdk iphonesimulator -configuration Release -derivedDataPath build/ReleaseDerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Package simulator app
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/ReleaseDerivedData/Build/Products/Release-iphonesimulator/LastCall.app build/LastCall-Simulator.zip

      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: LastCall-iOS-Simulator
          path: build/LastCall-Simulator.zip
          if-no-files-found: error
          retention-days: 7
