name: iOS build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build LAST CALL Debug for iPhone Simulator
        run: xcodebuild -project ios/LastCall.xcodeproj -scheme LastCall -sdk iphonesimulator -configuration Debug -derivedDataPath build/DebugDerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Build LAST CALL Release for iPhone Simulator
        run: xcodebuild -project ios/LastCall.xcodeproj -scheme LastCall -sdk iphonesimulator -configuration Release -derivedDataPath build/ReleaseDerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package simulator builds
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/DebugDerivedData/Build/Products/Debug-iphonesimulator/LastCall.app build/LastCall-Debug-Simulator.zip
          ditto -c -k --sequesterRsrc --keepParent build/ReleaseDerivedData/Build/Products/Release-iphonesimulator/LastCall.app build/LastCall-Release-Simulator.zip
      - name: Upload simulator builds
        uses: actions/upload-artifact@v4
        with:
          name: LastCall-iPhone-Simulator-Builds
          path: |
            build/LastCall-Debug-Simulator.zip
            build/LastCall-Release-Simulator.zip
          if-no-files-found: error
