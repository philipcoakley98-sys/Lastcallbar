name: iOS build check

on:
  push:
    paths:
      - 'ios/**'
  pull_request:
    paths:
      - 'ios/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build LAST CALL for iPhone Simulator
        run: |
          xcodebuild \
            -project ios/LastCall.xcodeproj \
            -target LastCall \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package simulator app
        run: |
          cd build/DerivedData/Build/Products/Debug-iphonesimulator
          ditto -c -k --sequesterRsrc --keepParent LastCall.app LastCall-Simulator.zip

      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: LastCall-iPhone-Simulator
          path: build/DerivedData/Build/Products/Debug-iphonesimulator/LastCall-Simulator.zip
          if-no-files-found: error
