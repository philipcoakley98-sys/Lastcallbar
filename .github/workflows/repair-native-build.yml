name: Repair native app build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair native source issues
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          native = Path('ios/LastCall/NativeApp.swift')
          s = native.read_text()
          s = s.replace('    @StateObject private var router = ConversationRouter.shared\n', '')
          old = '''        .sheet(item: Binding(get: { router.openID.map { ConversationRow(id: $0, otherUser: ProfileRow(id: UUID(), publicName: "LAST CALL", bio: nil, anonymous: true, privacyMessages: "nobody"), status: "accepted", latestMessage: nil) } }, set: { if $0 == nil { router.openID = nil } })) { conversation in NativeChat(conversation: conversation) }\n'''
          s = s.replace(old, '')
          s = s.replace('.tracking(.8)', '.tracking(0.8)')
          s = s.replace('catch { error = "Stories could not be refreshed just now." }', 'catch { self.error = "Stories could not be refreshed just now." }')
          s = s.replace('catch { error = authError(error) }', 'catch let caughtError { self.error = authError(caughtError) }')
          s = s.replace('catch { error = "That reaction could not be saved." }', 'catch { self.error = "That reaction could not be saved." }')
          s = s.replace('catch { error = "Your story could not be sent just now."; return false }', 'catch { self.error = "Your story could not be sent just now."; return false }')
          native.write_text(s)

          api = Path('ios/LastCall/SupabaseAPI.swift')
          s = api.read_text()
          for name in ('conversation_members', 'messages', 'notifications'):
              needle = f'URLComponents(url: baseURL.appendingPathComponent("rest/v1/{name}"), resolvingAgainstBaseURL: false)\n'
              replacement = f'URLComponents(url: baseURL.appendingPathComponent("rest/v1/{name}"), resolvingAgainstBaseURL: false)!\n'
              s = s.replace(needle, replacement)
          api.write_text(s)
          PY

      - name: Commit repair if needed
        shell: bash
        run: |
          if git diff --quiet -- ios/LastCall/NativeApp.swift ios/LastCall/SupabaseAPI.swift; then
            echo "No repair needed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ios/LastCall/NativeApp.swift ios/LastCall/SupabaseAPI.swift
            git commit -m "Fix native source compilation issues"
            git push
          fi

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build LAST CALL for iPhone Simulator
        run: |
          xcodebuild \
            -project ios/LastCall.xcodeproj \
            -scheme LastCall \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package simulator app
        run: |
          cd build/DerivedData/Build/Products/Debug-iphonesimulator
          ditto -c -k --sequesterRsrc --keepParent LastCall.app LastCall-Simulator.zip

      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: LastCall-iPhone-Simulator
          path: build/DerivedData/Build/Products/Debug-iphonesimulator/LastCall-Simulator.zip
          if-no-files-found: error
