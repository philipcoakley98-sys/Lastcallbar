name: LAST CALL profile polish
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply profile polish
        run: python3 scripts/apply-profile-polish.py
      - name: Commit and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios/LastCall/NativeApp.swift
          git rm .github/workflows/profile-polish.yml
          if git diff --cached --quiet; then
            echo "No profile changes to commit"
            exit 0
          fi
          git commit -m "Polish LAST CALL profile screen"
          git push
