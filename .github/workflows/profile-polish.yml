name: LAST CALL profile polish
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply profile route polish
        shell: bash
        run: |
          python3 scripts/apply-profile-polish.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/profile-polish.yml
          git add ios/LastCall/NativeApp.swift scripts/apply-profile-polish.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Polish LAST CALL profile screen'
          git push
